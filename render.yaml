services:
  - type: web
    name: elearning-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: APP_DEMO_SEED_ACCOUNTS
        value: "true"
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "https://*.github.io,http://localhost:3000,http://localhost:5500"
