# ==============================================================================
# WebLearnChinese Render Blueprint Specification
# 
# ARCHITECTURE OPTION 1: Unified Single-Container (ACTIVE - RECOMMENDED FOR FREE TIER)
# - Runs both Spring Boot (Java 21) and Python FastAPI Speech Service in 1 container.
# - Total RAM consumption: ~435MB (well within Render Free 512MB limit).
# - Instance hours: 720h/month (exactly 1 free service, never exhausts 750h/month quota).
# - Latency: 0ms loopback (127.0.0.1:8000) with zero inter-service network failure.
# - Keep-alive: 1 UptimeRobot monitor pinging /actuator/health keeps system warm 24/7.
#
# ARCHITECTURE OPTION 2: Decoupled Independent Services (COMMENTED BELOW)
# - Deploys backend and speech-service as 2 separate Free Web Services.
# - Requires 1,440 hours/month if both kept warm -> exhausts 750h quota in ~15.6 days.
# - Suitable only when upgrading to paid instances ($7/mo) or running scheduled monitors.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Primary Service: elearning-backend (Unified Full-Stack Container)
  # ----------------------------------------------------------------------------
  - type: web
    name: elearning-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.unified
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      # Memory tuning: Serial GC eliminates G1GC overhead; heap + metaspace safely fit in 512MB
      - key: JAVA_OPTS
        value: "-Xms128m -Xmx224m -XX:MaxMetaspaceSize=112m -XX:ReservedCodeCacheSize=48m -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"

      # Production Security Invariant: Demo account seeding strictly disabled
      - key: APP_DEMO_SEED_ACCOUNTS
        value: "false"

      # Initial Bootstrap Administrator (Active only when zero active admins exist)
      - key: APP_BOOTSTRAP_ADMIN_EMAIL
        value: "admin@elearning.local"
      - key: APP_BOOTSTRAP_ADMIN_PASSWORD
        sync: false

      # Fail-Fast JWT Secret: 256-bit cryptographically secure token
      - key: JWT_SECRET
        generateValue: true

      # CORS Whitelist for GitHub Pages and Local Development
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "https://khoadzsieucapvippro.github.io,https://*.github.io,http://localhost:3000,http://localhost:5500"
      - key: APP_CORS_ALLOWED_ORIGIN_PATTERNS
        value: "https://*.github.io"

      # Speech Engine Local Loopback Integration (0ms latency, zero WAN exposure)
      - key: SPEECH_ENGINE_LOCAL_ENABLED
        value: "true"
      - key: SPEECH_SERVICE_URL
        value: "http://127.0.0.1:8000"
      - key: INTERNAL_SPEECH_TOKEN
        generateValue: true

      # SRS 2-Minute Test Mode (temporarily lock canonical SM-2 for fast review testing)
      - key: APP_SRS_TEST_MODE_ENABLED
        value: "true"
      - key: APP_SRS_TEST_INTERVAL_MINUTES
        value: "2"

      # TiDB Cloud Serverless Connection Parameters
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

      # Brevo API Key for Worldwide Email Delivery (Port 443 HTTPS, All Recipients)
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: "keodeom1700a15@gmail.com"

      # Resend API Key for Cloud HTTPS Email Delivery (Port 443)
      - key: RESEND_API_KEY
        sync: false

      # Gmail SMTP Configuration for Real Password Reset Delivery
      - key: SPRING_MAIL_HOST
        value: "smtp.gmail.com"
      - key: SPRING_MAIL_PORT
        value: "587"
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false

# ==============================================================================
# DECOUPLED SERVICES CONFIGURATION (OPTION 2 - OPTIONAL / PAID / SCALED CLUSTERS)
# To use Decoupled Deployment instead of Unified Container:
# 1. Change dockerfilePath above to: ./Dockerfile
# 2. Change SPEECH_SERVICE_URL above to: https://<your-speech-subdomain>.onrender.com
# 3. Uncomment the speech-service block below:
# ------------------------------------------------------------------------------
