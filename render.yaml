services:
  - type: web
    name: elearning-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      # Do not set PORT: Render injects it and the Dockerfile binds ${PORT:-8080}.
      - key: JAVA_OPTS
        value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      - key: APP_DEMO_SEED_ACCOUNTS
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "https://khoadzsieucapvippro.github.io,https://*.github.io,http://localhost:3000,http://localhost:5500"
      - key: APP_CORS_ALLOWED_ORIGIN_PATTERNS
        value: "https://*.github.io"
      - key: SPEECH_ENGINE_LOCAL_ENABLED
        value: "true"
      # Must be an absolute https URL: LocalSpeechConfig prefixes https:// to bare
      # hosts, so a `property: host` value would become https://speech-service-3l49
      # and fail DNS resolution.
      - key: SPEECH_SERVICE_URL
        value: https://speech-service-3l49.onrender.com
      - key: SPEECH_ENGINE_LOCAL_BASE_URL
        value: https://speech-service-3l49.onrender.com
      - key: INTERNAL_SPEECH_TOKEN
        generateValue: true
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

  - type: web
    name: speech-service
    runtime: docker
    dockerfilePath: ./speech-service/Dockerfile
    dockerContext: ./speech-service
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: SPEECH_HOST
        value: "0.0.0.0"
      - key: SPEECH_PORT
        value: 8000
      - key: INTERNAL_SPEECH_TOKEN
        fromService:
          type: web
          name: elearning-backend
          envVarKey: INTERNAL_SPEECH_TOKEN
