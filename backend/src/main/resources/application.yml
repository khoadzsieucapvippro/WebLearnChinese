server:
  port: ${PORT:8080}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}

spring:
  application:
    name: elearning-backend
  config:
    import:
      - optional:classpath:application-local.yml

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    # Supported Environments:
    # 1. Local Development (MySQL 8.4+):
    #    jdbc:mysql://localhost:3306/elearning_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC
    # 2. TiDB Cloud Serverless Starter (100% Free Tier):
    #    jdbc:mysql://<gateway-host>:4000/<database>?sslMode=VERIFY_IDENTITY&useSSL=true&requireSSL=true&verifyServerCertificate=true&connectionCollation=utf8mb4_unicode_ci&characterEncoding=UTF-8&serverTimezone=UTC
    #    NOTE: connectionCollation=utf8mb4_unicode_ci is required because the schema uses
    #    utf8mb4_unicode_ci while MySQL 8 / TiDB default the session to utf8mb4_0900_ai_ci.
    #    The Hikari connection-init-sql below enforces the same collation even when the
    #    SPRING_DATASOURCE_URL supplied by Render does not include this parameter.
    #    sessionVariables=tidb_enable_clustered_index=OFF is NOT a fix for existing tables:
    #    it only affects tables created afterwards. V24 rebuilds VOCAB_RADICAL with an
    #    explicit NONCLUSTERED primary key instead of dropping a clustered primary key.
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:elearning_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      # The schema is uniformly utf8mb4_unicode_ci. MySQL 8 / TiDB default the
      # session collation to utf8mb4_0900_ai_ci, which makes Flyway migrations
      # that compare literals with table columns fail with error 1267
      # (Illegal mix of collations). Pin every pooled connection to the schema
      # collation so migrations and runtime queries agree.
      connection-init-sql: SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    encoding: UTF-8
    locations: classpath:db/migration
    clean-disabled: true

jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  issuer: ${JWT_ISSUER:elearning-backend}

app:
  business-timezone: ${APP_BUSINESS_TIMEZONE:Asia/Ho_Chi_Minh}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:https://khoadzsieucapvippro.github.io,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:3000}}
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:${CORS_ALLOWED_ORIGIN_PATTERNS:https://*.github.io}}
    allowed-methods: ${APP_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${APP_CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin,X-Requested-With}
    allow-credentials: ${APP_CORS_ALLOW_CREDENTIALS:false}
    max-age-seconds: ${APP_CORS_MAX_AGE_SECONDS:3600}
  demo:
    seed-accounts: ${APP_DEMO_SEED_ACCOUNTS:false}
  rate-limit:
    login:
      max-attempts: ${APP_RATE_LIMIT_LOGIN_MAX_ATTEMPTS:10}
      window-seconds: ${APP_RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

speech:
  engine:
    local:
      enabled: ${SPEECH_ENGINE_LOCAL_ENABLED:true}
      base-url: ${SPEECH_SERVICE_URL:${SPEECH_ENGINE_LOCAL_BASE_URL:http://127.0.0.1:8000}}
      internal-token: ${INTERNAL_SPEECH_TOKEN:${SPEECH_SERVICE_TOKEN:}}
      connect-timeout-ms: ${SPEECH_ENGINE_LOCAL_CONNECT_TIMEOUT_MS:15000}
      read-timeout-ms: ${SPEECH_ENGINE_LOCAL_READ_TIMEOUT_MS:30000}
