version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: elearning-mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: elearning_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  speech-service:
    build:
      context: ./speech-service
      dockerfile: Dockerfile
    container_name: elearning-speech-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SPEECH_HOST=0.0.0.0
      - SPEECH_PORT=8000

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elearning-backend
    restart: unless-stopped
    depends_on:
      - mysql
      - speech-service
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/elearning_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      JWT_SECRET: dev-compose-jwt-secret-key-minimum-256-bits-length-for-testing!
      SPEECH_ENGINE_LOCAL_ENABLED: "true"
      SPEECH_ENGINE_LOCAL_BASE_URL: http://speech-service:8000
      APP_DEMO_SEED_ACCOUNTS: "true"

volumes:
  mysql_data:
